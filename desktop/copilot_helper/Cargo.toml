[package]
name = "dot_copilot_helper"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
copilot-sdk = { version = "=2.0.1", default-features = false, features = ["runtime"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects"] }

[dev-dependencies]
tempfile = "3"

[[test]]
harness = false
name = "helper_protocol"
