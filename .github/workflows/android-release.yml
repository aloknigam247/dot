name: Android release

on:
  push:
    tags: ["android-v*"]

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
        working-directory: android
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a commit on main
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Android release tags must point to a commit reachable from main."
          }

      - name: Require the stable tag for this version
        run: |
          $part = "(?:0|[1-9][0-9]*)"
          $pattern = '^\s*versionName\s*=\s*"({0}\.{0}\.{0})"\s*$' -f $part
          $version = @(Select-String -Path app/build.gradle.kts -Pattern $pattern -CaseSensitive)
          if ($version.Count -ne 1 -or $env:GITHUB_REF_NAME -cne "android-v$($version[0].Matches[0].Groups[1].Value)") {
            throw "Release tag must match the stable Android versionName."
          }

  signed-release:
    needs: release-gate
    runs-on: ubuntu-latest
    environment: android-release
    defaults:
      run:
        shell: pwsh
        working-directory: android
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build signed optimized APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          DOT_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DOT_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          DOT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          $env:DOT_ANDROID_KEYSTORE = Join-Path $env:RUNNER_TEMP "$([guid]::NewGuid()).p12"
          try {
            if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_BASE64)) {
              throw "ANDROID_KEYSTORE_BASE64 is required."
            }
            $options = [IO.FileStreamOptions]::new()
            $options.Mode = [IO.FileMode]::CreateNew
            $options.Access = [IO.FileAccess]::Write
            $options.UnixCreateMode = [IO.UnixFileMode]::UserRead -bor [IO.UnixFileMode]::UserWrite
            $stream = [IO.File]::Open($env:DOT_ANDROID_KEYSTORE, $options)
            try {
              $bytes = [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64)
              $stream.Write($bytes, 0, $bytes.Length)
            } finally {
              $stream.Dispose()
            }
            Remove-Item Env:ANDROID_KEYSTORE_BASE64
            ./gradlew --no-daemon --no-configuration-cache :app:assembleRelease "-Pdot.signing.required=true"
            if ($LASTEXITCODE -ne 0) { throw "Signed release build failed." }
          } finally {
            if (Test-Path -LiteralPath $env:DOT_ANDROID_KEYSTORE) {
              Remove-Item -LiteralPath $env:DOT_ANDROID_KEYSTORE -Force
            }
          }

      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.ref_name }}-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 1
