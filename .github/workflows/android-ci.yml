name: Android CI

on:
  pull_request:
    paths:
      - ".github/workflows/android-ci.yml"
      - ".github/workflows/android-release.yml"
      - "android/**"
      - "common/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-ci.yml"
      - ".github/workflows/android-release.yml"
      - "android/**"
      - "common/**"

# A newer push to the same ref cancels the in-flight run.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    defaults:
      run:
        # The committed Gradle wrapper drives everything — no Android Studio. The
        # Android SDK is preinstalled on the ubuntu-latest image (ANDROID_HOME set),
        # so no SDK install/cache step is needed.
        working-directory: android
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Blocking gates, cheapest first. ktlintCheck enforces the ktlint_official
      # style (see android/.editorconfig); lint fails on Android Lint *errors*.
      - name: ktlint
        run: ./gradlew --no-daemon ktlintCheck

      - name: Android Lint
        run: ./gradlew --no-daemon lint

      - name: Unit tests
        run: ./gradlew --no-daemon test

      # JaCoCo coverage over the logic classes of app, chat_client, and chat_cli
      # (exclusions live in each module's build.gradle.kts). jacocoCoverageFloor
      # fails below the 98% line floor.
      - name: Coverage report + floor
        run: ./gradlew --no-daemon jacocoTestReport jacocoCoverageFloor

      # Require 100% coverage of the src/main lines this change touches. Runs from
      # the repo root (needs git history + repo-relative source paths) only on PRs,
      # where a base ref exists to diff against.
      - name: Patch coverage
        if: github.event_name == 'pull_request'
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $base = "${{ github.event.pull_request.base.sha }}"
          if (-not $base) { $base = "origin/main" }
          $diffPaths = @("android/app/src/main", "android/chat_cli/src/main", "android/chat_client/src/main")
          $sourceRoots = [ordered]@{
            app = "android/app/src/main/java"
            chat_cli = "android/chat_cli/src/main/kotlin"
            chat_client = "android/chat_client/src/main/java"
          }
          foreach ($module in $sourceRoots.Keys) {
            $report = "android/$module/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml"
            & common/scripts/coverage_patch.ps1 -ReportPath $report -BaseRef $base `
              -Format jacoco -DiffPath $diffPaths -SourceRoot $sourceRoots[$module]
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # assembleDebug is build verification: it catches manifest/resource/AAPT
      # packaging failures that the JVM unit tests can't. This step does not publish the APK.
      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Assemble unsigned optimized APK
        run: ./gradlew --no-daemon assembleRelease

  chat-cli-native:
    name: chat-cli-native
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # graalvm.properties pins the archive URL and SHA-256; ensure_graalvm.ps1
      # re-verifies the cached archive before use.
      - name: Cache GraalVM
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\dot\graalvm
          key: graalvm-${{ runner.os }}-${{ hashFiles('android/graalvm.properties') }}

      - name: Native build + smoke
        run: ./scripts/build_chat_cli.ps1

      - name: Upload native reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-cli-native-reports
          path: |
            android/chat_cli/build/reports/native
            android/chat_cli/build/reports/tests/nativeSmokeTest
          if-no-files-found: ignore
